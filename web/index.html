<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Share Control · 文件发布控制台</title><link rel="stylesheet" href="/control.css"></head><body><aside><div class="brand">↗ Share Control<small>本机文件 · 自由分享</small></div><nav id="nav"></nav><div class="aside-bottom">● 仅本机管理<small>127.0.0.1:8765</small></div></aside><main><header><div><div class="eyebrow">EXPOSURE CONSOLE / WORKSPACE</div><h1 id="title">概览与检查</h1></div><button id="check-all" class="secondary">↻ 检查环境</button></header><div id="banner" role="status" hidden></div><div id="content"></div></main><button id="task-dock" hidden>查看当前任务</button><dialog id="task-dialog"><div class="dialog-head"><div><div class="eyebrow">执行进度</div><h2 id="task-title"></h2><p id="task-summary"></p></div><button id="close-task" class="icon" aria-label="收起任务">×</button></div><div class="progress-label"><span id="step-count"></span><span id="elapsed"></span></div><progress id="progress" max="1" value="0"></progress><div id="steps"></div><div id="task-result"></div><footer><button id="task-logs" class="secondary">详细日志</button><div><button id="cancel-task" class="secondary">取消任务</button><button id="retry-task">重新检查并重试</button><button id="hide-task" class="secondary">收起</button></div></footer></dialog><script src="/control.js"></script></body></html>
